# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
  # This tells App Hosting to look for these secrets in Google Secret Manager
  # and make them available as environment variables to your app.
  environment:
    GEMINI_API_KEY:
      secret: GEMINI_API_KEY
    LOCALCOIN_MNEMONIC:
      secret: LOCALCOIN_MNEMONIC
    STRIPE_SECRET_KEY_EUR:
      secret: STRIPE_SECRET_KEY_EUR
    STRIPE_SECRET_KEY_USD:
      secret: STRIPE_SECRET_KEY_USD
    SMTP_HOST:
      secret: SMTP_HOST
    SMTP_PORT:
      secret: SMTP_PORT
    SMTP_USER:
      secret: SMTP_USER
    SMTP_PASS:
      secret: SMTP_PASS
    SMTP_FROM:
      secret: SMTP_FROM
    NEXT_PUBLIC_CONTACT_EMAIL:
      secret: NEXT_PUBLIC_CONTACT_EMAIL
    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_EUR:
      secret: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_EUR
    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_USD:
      secret: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_USD
    ENCRYPTION_SECRET:
      secret: ENCRYPTION_SECRET
    NEXT_PUBLIC_EURUSD_RATE:
      secret: NEXT_PUBLIC_EURUSD_RATE
    FIREBASE_ADMIN_SERVICE_ACCOUNT:
      secret: FIREBASE_ADMIN_SERVICE_ACCOUNT
    # This variable is required by the backend to know where to upload files.
    NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:
      secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    # Add a server-only variable for the bucket name
    FIREBASE_STORAGE_BUCKET:
      secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET