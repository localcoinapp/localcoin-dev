# apphosting.yaml
runConfig:
  maxInstances: 1

# Environment variables & secrets
env:
  # server-only secrets (runtime)
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability: [RUNTIME]

  - variable: LOCALCOIN_MNEMONIC
    secret: LOCALCOIN_MNEMONIC
    availability: [RUNTIME]

  - variable: STRIPE_SECRET_KEY_EUR
    secret: STRIPE_SECRET_KEY_EUR
    availability: [RUNTIME]

  - variable: STRIPE_SECRET_KEY_USD
    secret: STRIPE_SECRET_KEY_USD
    availability: [RUNTIME]

  - variable: SMTP_HOST
    secret: SMTP_HOST
    availability: [RUNTIME]
  - variable: SMTP_PORT
    secret: SMTP_PORT
    availability: [RUNTIME]
  - variable: SMTP_USER
    secret: SMTP_USER
    availability: [RUNTIME]
  - variable: SMTP_PASS
    secret: SMTP_PASS
    availability: [RUNTIME]
  - variable: SMTP_FROM
    secret: SMTP_FROM
    availability: [RUNTIME]

  - variable: ENCRYPTION_SECRET
    secret: ENCRYPTION_SECRET
    availability: [RUNTIME]

  - variable: FIREBASE_ADMIN_SERVICE_ACCOUNT
    secret: FIREBASE_ADMIN_SERVICE_ACCOUNT
    availability: [RUNTIME]
  
  - variable: RECAPTCHA_SECRET_KEY
    secret: RECAPTCHA_SECRET_KEY
    availability: [RUNTIME]

  # safe to expose (public) – needed at build + runtime
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_CONTACT_EMAIL
    secret: NEXT_PUBLIC_CONTACT_EMAIL
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_EUR
    secret: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_EUR
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_USD
    secret: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_USD
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_EURUSD_RATE
    secret: NEXT_PUBLIC_EURUSD_RATE
    availability: [BUILD, RUNTIME]
    
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    secret: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    availability: [BUILD, RUNTIME]
